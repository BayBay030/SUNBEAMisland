<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>島嶼地圖</title>

<!-- 把 'three' 這個名字指到本機 vendor 資料夾，所以不需要 npm，也不需要連網 -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<style>
  :root {
    --ui-bg: rgba(18, 20, 26, 0.82);
    --ui-border: rgba(255, 255, 255, 0.14);
    --ui-text: #f2f3f5;
    --ui-dim: #a8adb8;
    --sky-top: #e98fa6;
    --sky-bottom: #4a3f73;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--sky-bottom);
    color: var(--ui-text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* 游標跟著跑的提示：告訴你這個熱點會進去哪裡 */
  #tip {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    font-size: 13px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -140%);
    transition: opacity 0.14s ease;
    backdrop-filter: blur(6px);
  }
  #tip.on { opacity: 1; }

  /* 左上角：現在在哪個場景 */
  #place {
    position: fixed;
    z-index: 20;
    top: 18px;
    left: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    backdrop-filter: blur(6px);
  }
  #place .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #7fd1ae;
    box-shadow: 0 0 10px #7fd1ae;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  /* 連不到資料庫：點變琥珀色，旁邊冒出「離線」。平常完全看不到這兩個東西。 */
  #place .net-state {
    display: none;
    margin-left: 2px;
    padding: 2px 7px;
    border-radius: 5px;
    background: rgba(240, 176, 90, 0.16);
    border: 1px solid rgba(240, 176, 90, 0.4);
    color: #f0b05a;
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  #place.offline .dot {
    background: #f0b05a;
    box-shadow: 0 0 10px #f0b05a;
  }
  #place.offline .net-state { display: inline-block; }
  #place .name { font-size: 14px; letter-spacing: 0.06em; }

  /* 返回鈕，只有在室內才出現 */
  #back {
    position: fixed;
    z-index: 20;
    top: 18px;
    right: 18px;
    display: none;
    align-items: center;
    gap: 7px;
    padding: 10px 15px 10px 11px;
    border-radius: 10px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 0.16s ease, transform 0.16s ease;
  }
  #back.on { display: flex; }
  #back:hover { border-color: rgba(255,255,255,0.4); transform: translateY(-1px); }
  #back svg { width: 15px; height: 15px; display: block; }

  /* 右下角提示，告訴你可以做什麼 */
  #hint {
    position: fixed;
    z-index: 20;
    bottom: 18px;
    right: 18px;
    padding: 9px 13px;
    border-radius: 9px;
    background: rgba(18, 20, 26, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--ui-dim);
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 0.04em;
  }

  /* 過場黑幕 + 載入狀態 */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    background: var(--sky-bottom);
    transition: opacity 0.42s ease;
  }
  #veil.hide { opacity: 0; pointer-events: none; }
  #veil .veil-msg { color: var(--ui-dim); font-size: 13px; letter-spacing: 0.14em; }

  /* 面板（神木投球之類），點場景裡的東西才會跳出來 */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: none;
    place-items: center;
    padding: 24px;
    background: rgba(8, 11, 16, 0.62);
    backdrop-filter: blur(3px);
  }
  .panel.on { display: grid; }

  .panel .sheet {
    position: relative;
    width: min(400px, 100%);
    padding: 26px 26px 22px;
    border-radius: 16px;
    background: rgba(26, 30, 38, 0.96);
    border: 1px solid var(--ui-border);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  .panel h2 {
    margin: 0 0 6px;
    font-size: 17px;
    letter-spacing: 0.1em;
  }
  .panel .lead {
    margin: 0 0 18px;
    color: var(--ui-dim);
    font-size: 13px;
    line-height: 1.7;
  }

  .panel .close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ui-dim);
    cursor: pointer;
  }
  .panel .close:hover { border-color: var(--ui-border); color: var(--ui-text); }
  .panel .close svg { width: 15px; height: 15px; }

  /* 情緒按鈕 */
  .emotions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .emo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 12px 6px 10px;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid transparent;
    color: var(--ui-text);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .emo:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-1px); }
  .emo.sel { border-color: currentColor; background: rgba(255, 255, 255, 0.09); }
  .emo .orb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 14px currentColor;
  }
  .emo .label { color: var(--ui-text); }

  .note-label {
    display: block;
    margin-bottom: 7px;
    color: var(--ui-dim);
    font-size: 12px;
    letter-spacing: 0.06em;
  }
  .panel textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
  }
  .panel textarea:focus { border-color: rgba(255, 255, 255, 0.34); }
  .panel .count {
    margin: 5px 2px 16px;
    text-align: right;
    color: var(--ui-dim);
    font-size: 11px;
  }

  .panel .primary {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.92);
    border: none;
    color: #161a21;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .panel .primary:hover { opacity: 0.86; }
  .panel .primary:disabled { opacity: 0.3; cursor: default; }

  .panel .done {
    display: none;
    margin: 14px 0 0;
    padding: 11px 13px;
    border-radius: 9px;
    background: rgba(127, 209, 174, 0.1);
    border: 1px solid rgba(127, 209, 174, 0.3);
    color: #a8e3cb;
    font-size: 12.5px;
    line-height: 1.7;
    text-align: center;
  }
  .panel.thrown .done { display: block; }
  .panel.thrown .emotions,
  .panel.thrown .note-label,
  .panel.thrown textarea,
  .panel.thrown .count,
  .panel.thrown .primary { display: none; }

  .panel .stats {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--ui-dim);
    font-size: 12px;
    line-height: 1.9;
  }
  .panel .stats b { color: var(--ui-text); font-weight: 500; }

  /* 留言板 */
  .panel .sheet.wide { width: min(460px, 100%); }

  .msg-list {
    max-height: min(42vh, 300px);
    overflow-y: auto;
    margin-bottom: 16px;
    padding-right: 4px;
  }
  .msg-list::-webkit-scrollbar { width: 6px; }
  .msg-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.14);
    border-radius: 3px;
  }

  .msg {
    padding: 11px 13px;
    margin-bottom: 8px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .msg.mine { border-color: rgba(127, 209, 174, 0.3); }
  .msg .head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }
  .msg .who { font-size: 12.5px; letter-spacing: 0.06em; }
  .msg .when { color: var(--ui-dim); font-size: 11px; }
  .msg .body {
    color: #dfe2e8;
    font-size: 13px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .cheer {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    padding: 4px 9px;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--ui-border);
    color: var(--ui-dim);
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .msg .cheer:hover { border-color: rgba(255,255,255,0.32); color: var(--ui-text); }
  .msg .cheer.on { border-color: rgba(247, 154, 192, 0.45); color: #f7a9c8; cursor: default; }
  .msg .cheer svg { width: 12px; height: 12px; }

  .msg-empty {
    padding: 22px 0 26px;
    text-align: center;
    color: var(--ui-dim);
    font-size: 12.5px;
    line-height: 1.9;
  }

  .post-box input,
  .post-box textarea {
    width: 100%;
    margin-bottom: 8px;
    padding: 9px 12px;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
  }
  .post-box input:focus,
  .post-box textarea:focus { border-color: rgba(255, 255, 255, 0.34); }

  .post-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .post-row .count { margin: 0; color: var(--ui-dim); font-size: 11px; }
  .panel .primary.slim { width: auto; padding: 9px 20px; font-size: 13px; }

  .panel.full .post-box { display: none; }
  .panel.full .done { display: block; }

  /* 運氣小卡 */
  .panel .sheet.narrow { width: min(330px, 100%); text-align: center; }
  .panel .sheet.narrow .lead { margin-bottom: 20px; }

  .card-stage {
    perspective: 900px;
    margin-bottom: 20px;
  }
  .card {
    position: relative;
    width: 168px;
    height: 231px;
    margin: 0 auto;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.3, 0.9, 0.3, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 18px;
    border-radius: 13px;
    backface-visibility: hidden;
    border: 1px solid var(--ui-border);
  }
  .card .back {
    background: linear-gradient(150deg, #2b3550, #1a2133);
    color: #93b4d8;
  }
  .card .back svg { width: 74px; height: 102px; }

  .card .front {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border-color: rgba(255, 255, 255, 0.26);
  }
  .card .card-name {
    font-size: 30px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--card-hue, #fff);
    text-shadow: 0 0 22px var(--card-hue, transparent);
  }
  .card .card-line {
    color: #e3e6ec;
    font-size: 13px;
    line-height: 1.95;
  }

  .panel.drawn #fortune-draw { display: none; }
  .panel.drawn .done { display: block; }

  /* 選角色 */
  .chars {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 20px;
  }
  .char {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px 11px;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid transparent;
    color: var(--ui-text);
    font-family: inherit;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .char:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-1px); }
  .char.sel { border-color: rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.1); }
  .char svg { width: 34px; height: 40px; display: block; }

  .panel .sheet input[type="text"] {
    width: 100%;
    margin-bottom: 18px;
    padding: 10px 12px;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .panel .sheet input[type="text"]:focus { border-color: rgba(255,255,255,0.34); }

  /* 角色頭頂的名牌 */
  #tags { position: fixed; inset: 0; z-index: 18; pointer-events: none; }
  .tag {
    position: absolute;
    padding: 3px 9px;
    border-radius: 7px;
    background: rgba(18, 20, 26, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--ui-text);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    backdrop-filter: blur(4px);
  }
  .tag.me { border-color: rgba(127, 209, 174, 0.4); }

  /* 換角色的小按鈕，放在左上角身分列旁邊 */
  #who {
    position: fixed;
    z-index: 20;
    top: 62px;
    left: 18px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 9px 13px;
    border-radius: 10px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 0.16s ease;
  }
  #who.on { display: flex; }
  #who:hover { border-color: rgba(255,255,255,0.4); }
  #who .swatch {
    width: 9px; height: 9px; border-radius: 50%;
    background: currentColor;
  }

  /* 左下角聊天 */
  #chat {
    position: fixed;
    z-index: 22;
    left: 18px;
    bottom: 18px;
    width: min(300px, calc(100vw - 36px));
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #chat.on { display: flex; }

  #chat-log {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 34vh;
    overflow: hidden;
    justify-content: flex-end;
  }

  .chat-line {
    align-self: flex-start;
    max-width: 100%;
    padding: 6px 11px;
    border-radius: 9px;
    background: rgba(18, 20, 26, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12.5px;
    line-height: 1.65;
    word-break: break-word;
    backdrop-filter: blur(5px);
    animation: chat-in 0.22s ease;
    transition: opacity 0.6s ease;
  }
  .chat-line .who {
    margin-right: 7px;
    color: var(--chat-hue, #9fb4cc);
    letter-spacing: 0.06em;
  }
  .chat-line .what { color: #e6e9ee; }
  .chat-line.faded { opacity: 0.32; }

  @keyframes chat-in {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: none; }
  }

  #chat-box input {
    width: 100%;
    padding: 9px 13px;
    border-radius: 9px;
    background: rgba(18, 20, 26, 0.8);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    font-family: inherit;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    outline: none;
    backdrop-filter: blur(5px);
    transition: border-color 0.15s ease;
  }
  #chat-box input:focus { border-color: rgba(255,255,255,0.36); }
  #chat-box input::placeholder { color: rgba(168, 173, 184, 0.65); }

  /* 右下角的操作提示要讓開，不要跟聊天打架 */
  #hint { max-width: 42vw; }

  /* 畫面窄的時候兩個會疊在一起。提示是教學性質，先讓位給聊天 */
  @media (max-width: 620px) {
    #hint { display: none !important; }
    #chat { width: calc(100vw - 36px); }
  }

  /* 轉播播放器 */
  .panel .sheet.tv { width: min(680px, 100%); }
  .panel .sheet.tv h2 { margin-bottom: 14px; }

  .tv-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 11px;
    overflow: hidden;
    background: #0b0e14;
    border: 1px solid var(--ui-border);
  }
  .tv-stage iframe,
  .tv-stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .tv-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--ui-dim);
    font-size: 13px;
    line-height: 2;
  }

  /* 收集到的鑽石 */
  #gem-chip {
    position: fixed;
    z-index: 20;
    top: 18px;
    right: 18px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 12px;
    border-radius: 10px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    color: #a8e4f5;
    font-size: 13px;
    letter-spacing: 0.08em;
    backdrop-filter: blur(6px);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  #gem-chip.on { display: flex; }
  #gem-chip.got {
    transform: scale(1.12);
    border-color: rgba(168, 228, 245, 0.55);
  }
  #gem-chip svg { width: 16px; height: 16px; display: block; }

  /* 室內有返回鈕，鑽石往下讓一排 */
  body.indoor #gem-chip { top: 62px; }

  /* 出錯的時候講人話，不要丟 exception 給使用者看 */
  #oops {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    place-items: center;
    padding: 32px;
    background: var(--sky-bottom);
  }
  #oops.on { display: grid; }
  #oops .box {
    max-width: 520px;
    padding: 26px 28px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--ui-border);
    line-height: 1.9;
    font-size: 14px;
  }
  #oops h2 { margin: 0 0 12px; font-size: 16px; letter-spacing: 0.06em; }
  #oops code {
    display: block;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 7px;
    background: rgba(0,0,0,0.45);
    color: var(--ui-dim);
    font-size: 12px;
    word-break: break-all;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="place">
  <span class="dot"></span>
  <span class="name">—</span>
  <span class="net-state">離線</span>
</div>

<button id="back" type="button">
  <!-- 返回箭頭，自繪 SVG（介面不用 emoji） -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5"></path>
    <path d="M12 19l-7-7 7-7"></path>
  </svg>
  <span>返回島上</span>
</button>

<div id="hint">
  點地面　你的角色走過去<br>
  拖曳畫面　轉動整座島<br>
  點亮起來的建築　進入場景
</div>

<div id="veil"><span class="veil-msg">載入中</span></div>

<!-- 神木：投能量球 -->
<div id="tree-panel" class="panel">
  <div class="sheet">
    <button class="close" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>

    <h2>神木</h2>
    <p class="lead">今天過得怎麼樣？丟一顆球給它。</p>

    <div class="emotions" id="emotions"></div>

    <label class="note-label" for="note">想說一點什麼的話（可以不寫）</label>
    <textarea id="note" rows="2" maxlength="60" placeholder="一小段話就好"></textarea>
    <div class="count"><span id="note-count">0</span> / 60</div>

    <button id="throw" class="primary" type="button" disabled>先選一個情緒</button>

    <p class="done" id="throw-done">今天的球已經投進去了，明天再來。</p>

    <div class="stats" id="tree-stats"></div>
  </div>
</div>

<!-- 公佈欄：留言板 -->
<div id="board-panel" class="panel">
  <div class="sheet wide">
    <button class="close" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>

    <h2>公佈欄</h2>
    <p class="lead">留一句話給路過的人。</p>

    <div class="msg-list" id="msg-list"></div>

    <div class="post-box" id="post-box">
      <input id="msg-name" type="text" maxlength="12" placeholder="署名（可以不寫）" autocomplete="off">
      <textarea id="msg-text" rows="2" maxlength="120" placeholder="想說什麼？"></textarea>
      <div class="post-row">
        <span class="count"><span id="msg-count">0</span> / 120</span>
        <button id="msg-send" class="primary slim" type="button" disabled>貼上去</button>
      </div>
    </div>

    <p class="done" id="msg-limit">今天貼滿了，明天再來。</p>
  </div>
</div>

<!-- 望遠鏡：每天一張運氣小卡 -->
<div id="fortune-panel" class="panel">
  <div class="sheet narrow">
    <button class="close" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>

    <h2>今日運氣</h2>
    <p class="lead" id="fortune-lead">對著望遠鏡看看今天。</p>

    <div class="card-stage">
      <div class="card" id="fortune-card">
        <div class="face back">
          <svg viewBox="0 0 80 110" aria-hidden="true">
            <rect x="5" y="5" width="70" height="100" rx="8"
                  fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
            <circle cx="40" cy="55" r="19" fill="none" stroke="currentColor"
                    stroke-width="1.5" opacity="0.85"/>
            <circle cx="40" cy="55" r="7" fill="currentColor" opacity="0.85"/>
            <path d="M40 20v10M40 80v10M10 55h10M60 55h10"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
          </svg>
        </div>
        <div class="face front" id="fortune-front">
          <span class="card-name" id="fortune-name">—</span>
          <span class="card-line" id="fortune-line">—</span>
        </div>
      </div>
    </div>

    <button id="fortune-draw" class="primary" type="button">抽一張</button>
    <p class="done" id="fortune-done">今天的卡已經翻開了，明天再來看。</p>
  </div>
</div>

<!-- 選代表角色（第一次來才會跳） -->
<div id="join-panel" class="panel">
  <div class="sheet">
    <button class="close" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>

    <h2>選一個你</h2>
    <p class="lead">不用註冊。選好就能在島上走動。</p>

    <div class="chars" id="chars"></div>

    <label class="note-label" for="join-name">想取名字嗎（可以不取）</label>
    <input id="join-name" type="text" maxlength="8" placeholder="訪客" autocomplete="off">

    <button id="join-go" class="primary" type="button" disabled>先選一個角色</button>
  </div>
</div>

<button id="who" type="button">
  <span class="swatch"></span>
  <span class="who-name">—</span>
</button>

<!-- 房間的轉播 -->
<div id="tv-panel" class="panel">
  <div class="sheet tv">
    <button class="close" type="button" aria-label="關閉">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>

    <h2 id="tv-title">轉播</h2>
    <div class="tv-stage" id="tv-stage">
      <div class="tv-empty" id="tv-empty">今天沒有轉播。<br>晚點再來看看。</div>
    </div>
  </div>
</div>

<!-- 收集到的鑽石 -->
<div id="gem-chip">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 3h12l4 6-10 12L2 9z" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linejoin="round"/>
    <path d="M2 9h20M9 3 6 9l6 12M15 3l3 6-6 12" fill="none" stroke="currentColor"
          stroke-width="1.1" stroke-linejoin="round" opacity="0.65"/>
  </svg>
  <span id="gem-count">0</span>
</div>

<!-- 角色頭頂的名牌 -->
<div id="tags"></div>

<!-- 左下角聊天 -->
<div id="chat">
  <div id="chat-log"></div>
  <div id="chat-box">
    <input id="chat-input" type="text" maxlength="60"
           placeholder="說點什麼　按 Enter 送出" autocomplete="off">
  </div>
</div>

<div id="oops">
  <div class="box">
    <h2>場景載不起來</h2>
    <div id="oops-why">—</div>
    <code id="oops-detail"></code>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
